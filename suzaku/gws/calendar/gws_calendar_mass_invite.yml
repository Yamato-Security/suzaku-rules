title: Google Workspace Calendar Guest Added
id: 32cf5e37-9965-4186-a1c8-66c5b07797bc
status: experimental
description: Base rule for the Google Workspace calendar mass invite correlation. Matches a single guest being added to a calendar event.
references:
    - https://developers.google.com/workspace/admin/reports/v1/appendix/activity/calendar
author: Eric Capuano (@ecapuano)
date: 2026-09-10
tags:
    - attack.initial-access
    - attack.t1566.002
logsource:
    product: gcp
    service: google_workspace.calendar
detection:
    selection:
        eventName: 'add_event_guest'
    condition: selection
falsepositives:
    - Normal calendar usage. This base rule is not intended to alert on its own.
level: informational
