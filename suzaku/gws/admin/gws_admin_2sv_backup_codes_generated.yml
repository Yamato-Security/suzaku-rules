title: Google Workspace 2-Step Verification Backup Codes Generated
id: 8aa41139-f0b0-4402-becb-76143b174b22
status: experimental
description: |
    Detects generation of 2-Step Verification scratch codes (backup codes) for a user account
    (`GENERATE_2SV_SCRATCH_CODES`). The affected account is in `USER_EMAIL`.
    Scratch codes are single-use second factors that work without the enrolled device, so a set of freshly generated
    codes is a portable, long-lived MFA bypass: whoever holds them can satisfy 2SV from anywhere, and unlike a phone or
    passkey they survive a device wipe, a password reset, and the user noticing nothing at all. An attacker with admin
    or account access who generates codes has effectively downgraded the account to single-factor while leaving 2SV
    switched on and green in the admin console - quieter than `TURN_OFF_2_STEP_VERIFICATION` or a passkey revocation.
    Informational by design: 23 observations across the sample corpus, all from ordinary user-initiated enrollment and
    helpdesk workflows. Its value is as timeline context - specifically, codes generated for an account that did not
    just enroll in or recover 2SV, or generated by an actor who is not the account owner, is worth a look.
references:
    - https://developers.google.com/workspace/admin/reports/v1/appendix/activity/admin-user-settings
author: Eric Capuano (@ecapuano)
date: 2026-09-11
tags:
    - attack.persistence
    - attack.defense-evasion
    - attack.t1556.006
logsource:
    product: gcp
    service: google_workspace.admin
detection:
    selection:
        eventName: 'GENERATE_2SV_SCRATCH_CODES'
    condition: selection
falsepositives:
    - Users printing backup codes at 2SV enrollment, and helpdesk issuing codes to a user who lost their phone. Expect a steady low-volume baseline.
level: informational
