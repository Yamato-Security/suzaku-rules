title: Google Workspace Admin Forced Password Change on a User
id: 62c7a447-8a51-411a-8a54-6c638f6a56ec
status: experimental
description: |
    Detects an administrator setting "require password change at next sign-in" on a user account
    (`CHANGE_PASSWORD_ON_NEXT_LOGIN` with `NEW_VALUE` of true).
    This arrives as a sub-event of the same activity as `CHANGE_PASSWORD` when an admin resets a user's password, so it is
    both a routine helpdesk action and the tail end of an admin-driven account takeover.
    Informational by design: use it as timeline context next to the matching `CHANGE_PASSWORD`, not as a standalone alert.
references:
    - https://developers.google.com/workspace/admin/reports/v1/appendix/activity/admin-user-settings
author: Eric Capuano (@ecapuano)
date: 2026-09-10
tags:
    - attack.persistence
    - attack.t1098
logsource:
    product: gcp
    service: google_workspace.admin
detection:
    selection:
        eventName: 'CHANGE_PASSWORD_ON_NEXT_LOGIN'
        NEW_VALUE: 'true'
    condition: selection
falsepositives:
    - Routine helpdesk password resets and new-account provisioning. Expect this to be common in any tenant.
level: informational
